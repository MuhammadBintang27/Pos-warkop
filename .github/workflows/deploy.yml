# Build image di GitHub (bukan di VPS 2 GB yang kehabisan memori saat build), kirim ke GHCR,
# lalu panggil webhook Dokploy supaya VPS cukup menarik image jadi dan me-restart aplikasi.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nama image (GHCR wajib huruf kecil)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy ke Dokploy
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK" ]; then
            echo "Secret DOKPLOY_WEBHOOK belum diisi; image sudah di GHCR, deploy manual dari Dokploy."
            exit 0
          fi
          # payload gaya Docker Hub: Dokploy mencocokkan tag image yang dipakai aplikasi
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d '{"push_data":{"tag":"latest"}}' "$DOKPLOY_WEBHOOK"
