<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>POS Warkop</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
      form { width: min(420px, 92vw); padding: 28px; border-radius: 16px; background: #fff; box-shadow: 0 8px 30px rgb(0 0 0 / 0.08); display: flex; flex-direction: column; gap: 10px; }
      h1 { margin: 0 0 4px; font-size: 1.3rem; }
      input, button { font: inherit; padding: 11px 12px; border-radius: 10px; border: 1px solid #cbd5e1; }
      button { background: #f59e0b; border-color: #f59e0b; font-weight: 700; cursor: pointer; }
      p { margin: 0; color: #64748b; font-size: 0.9rem; }
      #salah { color: #dc2626; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <form id="form" hidden>
      <h1>POS Warkop</h1>
      <p>Masukkan alamat server yang diberikan, misalnya https://pos.warkopmu.com</p>
      <input id="alamat" placeholder="https://" autofocus required />
      <button type="submit">Hubungkan</button>
      <p id="salah"></p>
    </form>
    <script>
      const { invoke } = window.__TAURI__.core
      const $ = (id) => document.getElementById(id)

      invoke('ambil_config').then((c) => {
        if (c.server) location.replace(c.server)
        else $('form').hidden = false
      })

      $('form').addEventListener('submit', async (e) => {
        e.preventDefault()
        try {
          location.replace(await invoke('simpan_server', { alamat: $('alamat').value }))
        } catch (err) {
          $('salah').textContent = String(err)
        }
      })
    </script>
  </body>
</html>
