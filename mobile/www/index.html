<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>POS Warkop</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
      main { width: min(420px, 92vw); padding: 24px; border-radius: 16px; background: #fff; box-shadow: 0 8px 30px rgb(0 0 0 / 0.08); display: flex; flex-direction: column; gap: 10px; }
      h1 { margin: 0 0 4px; font-size: 1.3rem; }
      p { margin: 0; color: #64748b; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>POS Warkop</h1>
      <p>Membuka POS Warkop…</p>
    </main>
    <!-- shortcut: salinan dist dari node_modules (tanpa bundler); salin ulang bila versi Capacitor naik -->
    <script src="capacitor-core.js"></script>
    <script src="capacitor-push.js"></script>
    <script>
      // Alamat server tertanam di APK; pindah domain berarti build ulang APK.
      const SERVER = 'https://poswarkop.142-91-103-131.sslip.io'

      // Token FCM diambil di halaman ini (plugin native pasti tersedia di sini), lalu dibawa ke server lewat ?fcm=.
      // Gagal atau ditolak tetap lanjut membuka server tanpa notifikasi.
      const tokenPush = new Promise((selesai) => {
        const push = window.capacitorPushNotifications?.PushNotifications
        if (!window.Capacitor?.isNativePlatform?.()) return selesai('')
        if (!push) return selesai('')
        setTimeout(() => selesai(''), 5000)
        push.addListener('registration', (t) => selesai(t.value))
        push.addListener('registrationError', () => selesai(''))
        // Suara channel dikunci Android sejak dibuat, jadi suara baru memakai id channel baru dan yang lama dihapus.
        push.deleteChannel({ id: 'pesanan' }).catch(() => {})
        push
          .createChannel({ id: 'pesanan_v2', name: 'Pesanan masuk', importance: 5, visibility: 1, vibration: true, sound: 'pesanan.wav' })
          .catch(() => {})
          .then(() => push.requestPermissions())
          .then((p) => (p.receive === 'granted' ? push.register() : selesai('')))
          .catch(() => selesai(''))
      })

      async function buka(origin) {
        const fcm = await tokenPush
        location.replace(fcm ? `${origin}/?fcm=${encodeURIComponent(fcm)}` : origin)
      }

      buka(SERVER)
    </script>
  </body>
</html>
