<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PSD POS</title>
    <meta name="theme-color" content="#F08A1C" />
    <style>
      /* warna dan logo sama dengan ikon aplikasi dan splash Android, supaya pembukaan terasa satu kesatuan */
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; display: grid; place-items: center; overflow: hidden;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff;
        background: radial-gradient(circle at 25% 15%, rgb(255 255 255 / 0.28), transparent 55%), linear-gradient(170deg, #FDBA3B, #E06A0B);
        padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      }
      main { display: flex; flex-direction: column; align-items: center; text-align: center; animation: muncul 0.5s ease-out both; }
      .logo { width: 168px; height: 168px; filter: drop-shadow(0 14px 24px rgb(122 52 5 / 0.35)); }
      .uap path { animation: uap 2.4s ease-in-out infinite; }
      .uap path + path { animation-delay: 0.8s; }
      h1 { margin: 18px 0 4px; font-size: 1.9rem; font-weight: 800; letter-spacing: 0.01em; text-shadow: 0 2px 10px rgb(122 52 5 / 0.3); }
      p { margin: 0; font-size: 0.95rem; opacity: 0.9; }
      .bar { width: 160px; height: 4px; margin-top: 26px; border-radius: 99px; background: rgb(255 255 255 / 0.3); overflow: hidden; }
      .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: inherit; background: #fff; animation: jalan 1.2s ease-in-out infinite; }
      @keyframes muncul { from { opacity: 0; transform: translateY(12px) scale(0.96); } }
      @keyframes uap { 0%, 100% { opacity: 0.2; transform: translateY(8px); } 50% { opacity: 1; transform: translateY(-6px); } }
      @keyframes jalan { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; } }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="80 60 352 380" aria-hidden="true">
        <defs>
          <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#FFFFFF" /><stop offset=".7" stop-color="#FFF8EE" /><stop offset="1" stop-color="#F1DFC6" />
          </linearGradient>
          <radialGradient id="kopi" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#9A5B2A" /><stop offset="1" stop-color="#4A250E" /></radialGradient>
        </defs>
        <g class="uap" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="18">
          <path d="M222 196c-22-26 22-46 0-80" />
          <path d="M290 196c-22-26 22-46 0-96" />
        </g>
        <ellipse cx="256" cy="400" rx="164" ry="30" fill="#F1DFC6" />
        <ellipse cx="256" cy="394" rx="164" ry="28" fill="#fff" />
        <path d="M368 252c58-6 64 82-8 84" fill="none" stroke="#F1DFC6" stroke-width="26" stroke-linecap="round" />
        <path d="M132 226c0 108 52 166 124 166s124-58 124-166z" fill="url(#cup)" />
        <ellipse cx="256" cy="226" rx="124" ry="26" fill="#fff" />
        <ellipse cx="256" cy="228" rx="108" ry="18" fill="url(#kopi)" />
        <path d="M164 262c4 52 28 88 60 104" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".9" />
      </svg>
      <h1>PSD POS</h1>
      <p>Menyiapkan kasir…</p>
      <div class="bar" role="progressbar" aria-label="Memuat"></div>
    </main>
    <!-- shortcut: salinan dist dari node_modules (tanpa bundler); salin ulang bila versi Capacitor naik -->
    <script src="capacitor-core.js"></script>
    <script src="capacitor-push.js"></script>
    <script>
      // Alamat server tertanam di APK; pindah domain berarti build ulang APK.
      const SERVER = 'https://psdpos.paripurnasentosadigital.id'

      // Token FCM diambil di halaman ini (plugin native pasti tersedia di sini), lalu dibawa ke server lewat ?fcm=.
      // Gagal atau ditolak tetap lanjut membuka server tanpa notifikasi.
      const tokenPush = new Promise((selesai) => {
        const push = window.capacitorPushNotifications?.PushNotifications
        if (!window.Capacitor?.isNativePlatform?.()) return selesai('')
        if (!push) return selesai('')
        setTimeout(() => selesai(''), 5000)
        push.addListener('registration', (t) => selesai(t.value))
        push.addListener('registrationError', () => selesai(''))
        // Suara channel dikunci Android sejak dibuat, jadi suara baru memakai id channel baru dan yang lama dihapus.
        push.deleteChannel({ id: 'pesanan' }).catch(() => {})
        push
          .createChannel({ id: 'pesanan_v2', name: 'Pesanan masuk', importance: 5, visibility: 1, vibration: true, sound: 'pesanan.wav' })
          .catch(() => {})
          .then(() => push.requestPermissions())
          .then((p) => (p.receive === 'granted' ? push.register() : selesai('')))
          .catch(() => selesai(''))
      })

      async function buka(origin) {
        const fcm = await tokenPush
        location.replace(fcm ? `${origin}/?fcm=${encodeURIComponent(fcm)}` : origin)
      }

      buka(SERVER)
    </script>
  </body>
</html>
